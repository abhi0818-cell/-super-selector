<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pitch XI Preview</title>
<style>
  :root {
    --bg:#F5F0E0; --accent:#C9A84C; --accent-2:#A67C00;
    --text:#1C1F26; --muted:#7A7060; --border:#D6CFA8;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--bg); font-family:'Segoe UI',sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:28px 16px; gap:18px; min-height:100vh;
  }
  h2 { font-size:14px; color:var(--muted); font-weight:700; letter-spacing:.6px; text-transform:uppercase; }

  .xi-card {
    width:360px; background:#fff;
    border-radius:16px; overflow:hidden;
    box-shadow:0 6px 28px rgba(0,0,0,0.13);
    border:1px solid var(--border);
  }
  .xi-header {
    padding:10px 16px; display:flex; justify-content:space-between; align-items:center;
    background:var(--bg); border-bottom:1px solid var(--border);
  }
  .xi-header .match-lbl { font-size:12px; font-weight:700; }
  .xi-header .pts-lbl   { font-size:14px; font-weight:800; color:var(--accent-2); }

  /* ───────────────────────────────────────────
     OVAL PITCH
  ─────────────────────────────────────────── */
  .pitch-outer {
    /* Outer green rectangle — gives us the card-edge-to-edge fill */
    background: #1a5c1a;
    padding: 0 0 12px;
    position: relative;
  }

  .pitch-oval {
    /* The oval itself: clip to ellipse, greenfield gradient inside */
    position: relative;
    margin: 14px 18px;          /* side margin so oval doesn't touch card edges */
    height: 460px;
    clip-path: ellipse(50% 50% at 50% 50%);
    background:
      radial-gradient(ellipse 80% 88% at 50% 50%,
        #4ec94e 0%,
        #3aad3a 22%,
        #2b8f2b 45%,
        #1d6e1d 65%,
        #0f470f 85%,
        #09300d 100%
      );
    display: flex;
    flex-direction: column;
    justify-content: stretch;
    padding: 20px 18px 40px;    /* top/bottom padding keeps rows inside safe ellipse zone */
    overflow: visible;          /* children lay out normally; clip-path handles the visual cut */
  }

  /* Lawn mowing stripes */
  .pitch-oval::before {
    content:'';
    position:absolute; inset:0;
    background: repeating-linear-gradient(
      180deg,
      transparent 0px, transparent 24px,
      rgba(255,255,255,0.035) 24px, rgba(255,255,255,0.035) 48px
    );
    pointer-events:none;
  }

  /* SVG boundary rope + pitch strip — drawn absolutely inside .pitch-oval */
  .pitch-svg-overlay {
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; overflow:visible;
  }

  /* Role rows */
  .pitch-row {
    display:flex; flex-direction:column; align-items:center; gap:4px;
    position:relative; z-index:2; gap:2px;
  }
  .pitch-role-lbl {
    font-size:8px; font-weight:800; letter-spacing:2px;
    color:rgba(255,255,255,0.38); text-transform:uppercase;
    margin-bottom:1px;
  }
  .pitch-row-players { display:flex; justify-content:center; gap:calc(var(--tsz,34px)*0.18); flex-wrap:nowrap; }

  /* Player token */
  .pitch-player {
    display:flex; flex-direction:column; align-items:center; gap:2px;
    position:relative; cursor:default;
  }
  .pitch-jwrap { position:relative; width:var(--tsz,34px); }
  .pitch-jwrap svg {
    width:var(--tsz,34px); height:auto; display:block;
    filter: drop-shadow(0 3px 7px rgba(0,0,0,0.65));
  }
  .pitch-cbadge {
    position:absolute; top:calc(var(--tsz,34px)*-0.15); right:calc(var(--tsz,34px)*-0.18);
    width:calc(var(--tsz,34px)*0.44); height:calc(var(--tsz,34px)*0.44); border-radius:50%;
    font-size:calc(var(--tsz,34px)*0.24); font-weight:900;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 4px rgba(0,0,0,0.55);
  }
  .pitch-cbadge.c  { background:#C9A84C; color:#1C1F26; }
  .pitch-cbadge.vc { background:#ffffffee; color:#7a5500; }

  .pitch-nametag {
    font-size:calc(var(--tsz,34px)*0.28); font-weight:700; color:#fff;
    text-shadow:0 1px 4px rgba(0,0,0,1), 0 0 6px rgba(0,0,0,.8);
    text-align:center; max-width:calc(var(--tsz,34px)*1.3);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .pitch-ptag {
    font-size:calc(var(--tsz,34px)*0.235); font-weight:700; color:#FFD966;
    text-shadow:0 1px 3px rgba(0,0,0,.9);
  }

  /* Empty slot */
  .pitch-empty-slot {
    width:var(--tsz,34px); height:calc(var(--tsz,34px)*1.24); border-radius:8px;
    border:1.5px dashed rgba(255,255,255,0.2);
    display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--tsz,34px)*0.235); font-weight:700; color:rgba(255,255,255,0.25);
    letter-spacing:.5px;
  }

  /* Hover controls */
  .pitch-controls {
    position:absolute; bottom:-3px; left:50%;
    transform:translateX(-50%);
    display:none; gap:2px; z-index:20; white-space:nowrap;
  }
  .pitch-player:hover .pitch-controls { display:flex; }
  .pitch-ctrl-btn {
    width:calc(var(--tsz,34px)*0.5); height:calc(var(--tsz,34px)*0.5); border-radius:4px; padding:0;
    font-size:calc(var(--tsz,34px)*0.235); font-weight:800; cursor:pointer;
    border:1px solid rgba(255,255,255,0.3);
    background:rgba(0,0,0,0.72); color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .pitch-ctrl-btn.c-on  { background:#C9A84C; color:#1C1F26; border-color:#C9A84C; }
  .pitch-ctrl-btn.vc-on { background:rgba(255,220,80,.8); color:#1C1F26; }
  .pitch-ctrl-btn.rm    { color:#f88; }

  /* Stats footer */
  .xi-stats {
    display:flex; justify-content:space-around; padding:8px 14px;
    border-top:1px solid var(--border); background:var(--bg);
    font-size:11px;
  }
  .xi-stats span { color:var(--muted); }
  .xi-stats strong { color:var(--text); }

  .note { font-size:11px; color:var(--muted); }
  .mode-btn {
    padding:3px 10px; border-radius:20px; border:1.5px solid var(--border);
    background:#fff; font-size:10px; cursor:pointer; font-weight:600;
    color:var(--muted); transition:all .15s;
  }
  .mode-btn.active { background:var(--accent); border-color:var(--accent); color:#1C1F26; }

  .pitch-role-icon {
    position: absolute;
    bottom: 2px;
    right: calc(var(--tsz,34px)*-0.42);
    width: calc(var(--tsz,34px)*0.44);
    height: calc(var(--tsz,34px)*0.44);
    object-fit: contain;
    filter: drop-shadow(0 1px 4px rgba(0,0,0,0.9));
  }
</style>
</head>
<body>

<h2>🏏 Daily XI — Pitch View</h2>
<p class="note">Hover any jersey to see C / V / × controls</p>

<div class="xi-card">
  <div class="xi-header">
    <div class="match-lbl">M3 · AUS-W vs IND-W</div>
    <div style="display:flex;gap:6px;align-items:center;">
      <button class="mode-btn active" data-mode="xi"       onclick="setMode('xi')">XI (11)</button>
      <button class="mode-btn"        data-mode="capacity" onclick="setMode('capacity')">Max slots</button>
    </div>
  </div>

  <div class="pitch-outer">
    <div class="pitch-oval" id="pitchOval">

      <!-- SVG overlay: boundary rope + pitch strip -->
      <svg class="pitch-svg-overlay" viewBox="0 0 304 460" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Boundary rope (dashed ellipse) -->
        <ellipse cx="152" cy="230" rx="145" ry="220"
          fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2"
          stroke-dasharray="7 5"/>
        <!-- Pitch strip -->
        <rect x="134" y="140" width="36" height="180" rx="5"
          fill="url(#pitchGrad)" opacity="0.72"/>
        <!-- Crease lines -->
        <line x1="120" y1="165" x2="184" y2="165" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
        <line x1="120" y1="295" x2="184" y2="295" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
        <!-- Stumps (top) -->
        <line x1="147" y1="155" x2="147" y2="167" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
        <line x1="152" y1="155" x2="152" y2="167" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
        <line x1="157" y1="155" x2="157" y2="167" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
        <!-- Stumps (bottom) -->
        <line x1="147" y1="293" x2="147" y2="305" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
        <line x1="152" y1="293" x2="152" y2="305" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
        <line x1="157" y1="293" x2="157" y2="305" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
        <defs>
          <linearGradient id="pitchGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#b8893a"/>
            <stop offset="40%"  stop-color="#d4a85a"/>
            <stop offset="60%"  stop-color="#d4a85a"/>
            <stop offset="100%" stop-color="#b8893a"/>
          </linearGradient>
        </defs>
      </svg>

      <!-- Player rows injected here -->
      <div id="rowsMount" style="display:flex;flex-direction:column;justify-content:space-evenly;align-items:stretch;flex:1;width:100%;z-index:2;"></div>
    </div>
  </div>

  <div class="xi-stats">
    <div><span>Players </span><strong>11/11</strong></div>
    <div><span>Budget </span><strong>11.0</strong></div>
    <div><span>1·4·2·4 </span></div>
  </div>
</div>

function isLight(h){const c=h.replace('#','');const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);return(r*299+g*587+b*114)/1000>145;}
function deriveSec(h){const c=h.replace('#','');const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);const l=0.299*r+0.587*g+0.114*b;if(l<100)return'#'+[Math.min(255,r*.3+200),Math.min(255,g*.3+170),Math.min(255,b*.3+60)].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');if(l<170)return'#'+[Math.min(255,(255-r)*.7+r*.3),Math.min(255,(255-g)*.4+g*.6),Math.min(255,b*.3+30)].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');return'#'+[r*.35,g*.35,b*.35].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');}

  const ls='M 3.0,65.0 L 21.5,78.3 L 31.5,59.8 L 42.0,16.0 L 14.0,32.0 Z';
  const rs='M 127.5,70.3 L 107.5,78.8 L 98.5,61.8 L 90.0,18.0 L 115.0,32.0 Z';
  const col='M 48.0,8.0 L 82.5,8.3 L 89.5,16.8 L 42.5,15.8 Z';
  return `<svg width="141" height="179" viewBox="0 0 141 179" xmlns="http://www.w3.org/2000/svg">
    <path d="${body}" fill="${shirt}" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="${ls}"  fill="${sec}" opacity=".88"/>
    <path d="${rs}"  fill="${sec}" opacity=".88"/>
    <path d="${col}" fill="${sec}" opacity=".92"/>
    <path d="${body}" fill="none" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="65" y="118" text-anchor="middle" dominant-baseline="middle"
      font-family="Arial Black,Arial" font-size="26" font-weight="900"
      fill="${tc}" opacity=".9">${inits}</text>
  </svg>`;
}
function inits(n){return n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();}

const ROLES=['wk','bat','ar','bowl'];
const RLBL={wk:'Wicket Keeper',bat:'Batsmen',ar:'All-Rounders',bowl:'Bowlers'};
const MIN={wk:1,bat:3,ar:1,bowl:3};

function playerToken(p) {
  const ln = p.name.split(' ').pop();
  const badge = p.cap ? '<span class="pitch-cbadge c">C</span>'
              : p.vc  ? '<span class="pitch-cbadge vc">V</span>' : '';
  return `<div class="pitch-player" title="${p.name}">
    <div class="pitch-jwrap">
      ${jerseyHtml(inits(p.name), p.shirt, p.c2)}
      ${badge}
      <img class="pitch-role-icon" src="${ROLE_ICON[p.role]}" alt="${p.role}" />
      <div class="pitch-controls">
        <button class="pitch-ctrl-btn ${p.cap?'c-on':''}">C</button>
        <button class="pitch-ctrl-btn ${p.vc?'vc-on':''}">V</button>
        <button class="pitch-ctrl-btn rm">×</button>
      </div>
    </div>
    <div class="pitch-nametag">${ln}</div>
    <div class="pitch-ptag">${p.pts}pt</div>
  </div>`;
}
function emptyToken(role){
  return `<div class="pitch-player"><div class="pitch-empty-slot">${role.toUpperCase()}</div></div>`;
}


// ── Capacity test squad (shows max slots per row) ──────────────────────────
const CAPACITY_SQUAD = [

  // BAT row: up to 6
  { name:'E Perry',    role:'bat',  shirt:'#f5a623', c2:'#003478', cap:false, vc:true,  pts:62  },
  { name:'S Mandhana', role:'bat',  shirt:'#0057a8', c2:'#f0a500', cap:false, vc:false, pts:55  },

  { name:'D Hazell',   role:'bowl', shirt:'#f5a623', c2:'#003478', cap:false, vc:false, pts:32  },
  { name:'M Kapp',     role:'bowl', shirt:'#0057a8', c2:'#f0a500', cap:false, vc:false, pts:29  },

];

let currentMode = 'xi';  // 'xi' | 'capacity'

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  const squad = mode === 'capacity' ? CAPACITY_SQUAD : SQUAD;
  renderWith(squad, mode === 'capacity' ? {wk:4,bat:6,ar:4,bowl:5} : {wk:1,bat:3,ar:1,bowl:3});
}

function renderWith(squad, minSlots) {
  const groups={wk:[],bat:[],ar:[],bowl:[]};
  squad.forEach(p=>{ if(groups[p.role]) groups[p.role].push(p); });

  const html = ROLES.map(role => {
    const tokens = groups[role].map(playerToken);
    while(tokens.length < minSlots[role]) tokens.push(emptyToken(role));
    return `<div class="pitch-row">
      <div class="pitch-row-players">${tokens.join('')}</div>
    </div>`;
  }).join('');

  document.getElementById('rowsMount').innerHTML = html;
  requestAnimationFrame(fitRows);
}


// ── Dynamic token sizing: scale each row so no player clips the oval ────────
function fitRows() {
  const oval = document.getElementById('pitchOval');
  if (!oval) return;
  const ow = oval.clientWidth;
  const oh = oval.clientHeight;
  const a = ow / 2, b = oh / 2;
  const N = 4; // always 4 role rows

  oval.querySelectorAll('.pitch-row').forEach((row, i) => {
    row.style.removeProperty('--tsz'); // reset to default first
    const n = row.querySelectorAll('.pitch-player').length;
    if (!n) return;

    // Approximate vertical centre of this row (space-evenly layout)
    const yFrac = (2 * i + 1) / (2 * N);       // 1/8, 3/8, 5/8, 7/8
    const dy    = (yFrac - 0.5) * oh;            // signed offset from oval centre

    // Ellipse chord width at this y, with 84% safe margin
    const availW = 2 * a * Math.sqrt(Math.max(0, 1 - (dy / b) ** 2)) * 0.84;

    // Token footprint at default tsz (34):
    //   n jerseys + (n-1) gaps (18% of tsz each) + 1 icon overhang (42% of tsz)
    //   = tsz * (n + (n-1)*0.18 + 0.42)
    //   = tsz * (n*1.18 - 0.18 + 0.42)
    //   = tsz * (n*1.18 + 0.24)
    const MAX_TSZ = 36, MIN_TSZ = 14;
    const tsz = Math.min(MAX_TSZ, Math.max(MIN_TSZ, availW / (n * 1.18 + 0.24)));
    row.style.setProperty('--tsz', tsz + 'px');
  });
}

function render() { renderWith(SQUAD, MIN); }
render();
window.addEventListener('resize', () => requestAnimationFrame(fitRows));
</script>
