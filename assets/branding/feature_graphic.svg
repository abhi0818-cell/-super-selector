<svg viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2A4A"/>
      <stop offset="100%" stop-color="#1F5C99"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD24C"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- decorative stitching / seam pattern -->
  <path d="M0 60 Q 512 20 1024 60" stroke="#ffffff22" stroke-width="4" fill="none"/>
  <path d="M0 440 Q 512 480 1024 440" stroke="#ffffff22" stroke-width="4" fill="none"/>

  <!-- title -->
  <text x="60" y="110" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#FFFFFF">Maestro</text>
  <text x="60" y="155" font-family="Arial, sans-serif" font-size="26" fill="#BFE0FF">Build your dream XI. Score live. Zero entry fee.</text>

  <!-- player card mock -->
  <g transform="translate(60,190)">
    <rect width="280" height="260" rx="16" fill="#0B1E33" stroke="#3C7DBF" stroke-width="2"/>
    <circle cx="140" cy="70" r="42" fill="#2E6DA4"/>
    <text x="140" y="80" font-family="Arial" font-size="30" fill="#fff" text-anchor="middle" font-weight="700">RS</text>
    <text x="140" y="140" font-family="Arial" font-size="22" fill="#fff" text-anchor="middle" font-weight="700">R. Sharma</text>
    <text x="140" y="165" font-family="Arial" font-size="16" fill="#9FC6E8" text-anchor="middle">BAT · MI</text>
    <rect x="30" y="185" width="220" height="34" rx="8" fill="url(#chip)"/>
    <text x="140" y="208" font-family="Arial" font-size="18" font-weight="700" fill="#3A2400" text-anchor="middle">9.5 CR</text>
    <circle cx="250" cy="30" r="18" fill="#FFD24C"/>
    <text x="250" y="37" font-family="Arial" font-size="18" font-weight="700" fill="#3A2400" text-anchor="middle">C</text>
  </g>

  <!-- selected XI budget bar mock -->
  <g transform="translate(380,190)">
    <rect width="580" height="260" rx="16" fill="#0B1E33" stroke="#3C7DBF" stroke-width="2"/>
    <text x="24" y="40" font-family="Arial" font-size="20" font-weight="700" fill="#fff">Your XI</text>
    <text x="556" y="40" font-family="Arial" font-size="18" fill="#9FC6E8" text-anchor="end">8 / 11 picked</text>

    <rect x="24" y="56" width="532" height="18" rx="9" fill="#0F2A4A"/>
    <rect x="24" y="56" width="360" height="18" rx="9" fill="url(#chip)"/>
    <text x="556" y="70" font-family="Arial" font-size="14" fill="#9FC6E8" text-anchor="end">72.4 / 100 credits</text>

    <!-- role rows -->
    <g font-family="Arial" font-size="16" fill="#DCEEFF">
      <text x="24" y="120">WK</text><rect x="70" y="105" width="120" height="14" rx="7" fill="#2E6DA4"/><rect x="70" y="105" width="90" height="14" rx="7" fill="#5CC8FF"/>
      <text x="24" y="150">BAT</text><rect x="70" y="135" width="120" height="14" rx="7" fill="#2E6DA4"/><rect x="70" y="135" width="110" height="14" rx="7" fill="#5CC8FF"/>
      <text x="24" y="180">AR</text><rect x="70" y="165" width="120" height="14" rx="7" fill="#2E6DA4"/><rect x="70" y="165" width="60" height="14" rx="7" fill="#5CC8FF"/>
      <text x="24" y="210">BOWL</text><rect x="70" y="195" width="120" height="14" rx="7" fill="#2E6DA4"/><rect x="70" y="195" width="100" height="14" rx="7" fill="#5CC8FF"/>
    </g>

    <rect x="230" y="100" width="326" height="130" rx="12" fill="#123054"/>
    <text x="393" y="145" font-family="Arial" font-size="16" fill="#9FC6E8" text-anchor="middle">Live points</text>
    <text x="393" y="195" font-family="Arial" font-size="46" font-weight="700" fill="#5CC8FF" text-anchor="middle">248</text>
  </g>

  <!-- CTA -->
  <rect x="770" y="440" width="190" height="46" rx="23" fill="url(#chip)"/>
  <text x="865" y="469" font-family="Arial" font-size="20" font-weight="700" fill="#3A2400" text-anchor="middle">Get the app</text>
</svg>
