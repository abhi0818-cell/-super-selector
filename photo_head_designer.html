<title>Player Photo & Silhouette Designer</title>
<style>
  body { font-family: Arial, sans-serif; background: #F5F0E0; margin: 0; padding: 16px; }
  h3 { text-align: center; margin: 0 0 10px; color: #333; }
  .wrap { display:flex; gap:32px; justify-content:center; flex-wrap:wrap; align-items:flex-start; }
  .col { text-align:center; }
  .col p { font-size:11px; color:#888; font-weight:bold; text-transform:uppercase; letter-spacing:1px; margin:0 0 6px; }
  .preview-box { background:#fff; border:2px solid #ccc; border-radius:8px; padding:12px; display:inline-block; }
  .controls { width:320px; }
  .row { margin-bottom: 14px; }
  .row label { display:flex; justify-content:space-between; font-size:13px; color:#555; margin-bottom:4px; }
  .row input[type=range] { width:100%; }
  .modes { display:flex; gap:6px; justify-content:center; margin-top:10px; }
  button { padding:6px 14px; border-radius:6px; border:1px solid #aaa; cursor:pointer; font-size:12px; background:#fff; }
  button.active { background:#1e3a8a; color:#fff; border-color:#1e3a8a; }
  button:hover { background:#e8e0cc; }
  button.save { background:#e8f5e9; border-color:#4caf50; color:#2e7d32; font-weight:bold; margin-top:14px; width:100%; }
  button.save:hover { background:#c8e6c9; }
  textarea { width:100%; height:150px; font-family:monospace; font-size:11px; margin-top:8px; }
  #status { text-align:center; font-size:11px; color:#666; margin-top:8px; min-height:16px; }
  input[type=text] { width:100%; box-sizing:border-box; margin-top:8px; padding:4px; }
</style>
</head>

const state = {r:40, overlap:10, cx:65.25, headroom:4, mode:'photo', cropT:0, cropB:0, cropL:0, cropR:0};
const rSlider=document.getElementById('rSlider'), oSlider=document.getElementById('oSlider'), cxSlider=document.getElementById('cxSlider'), hrSlider=document.getElementById('hrSlider');
const ctSlider=document.getElementById('ctSlider'), cbSlider=document.getElementById('cbSlider'), clSlider=document.getElementById('clSlider'), crSlider=document.getElementById('crSlider');
const clipCircle=document.getElementById('clipCircle'), cropRect=document.getElementById('cropRect'), photoImg=document.getElementById('photoImg'), silImg=document.getElementById('silImg'), prev=document.getElementById('prev');
const rOut=document.getElementById('rOut'), oOut=document.getElementById('oOut'), cxOut=document.getElementById('cxOut'), hrOut=document.getElementById('hrOut');
const ctOut=document.getElementById('ctOut'), cbOut=document.getElementById('cbOut'), clOut=document.getElementById('clOut'), crOut=document.getElementById('crOut');
const exportBox=document.getElementById('exportBox');
let silSel = 0;
function render(){
  const cy = 8 - state.r + state.overlap;
  const headTop = cy - state.r;
  const headroom = Math.ceil(-headTop) + state.headroom;
  prev.setAttribute('viewBox', '0 ' + (-headroom) + ' 141 ' + (179+headroom));
  clipCircle.setAttribute('cx', state.cx); clipCircle.setAttribute('cy', cy); clipCircle.setAttribute('r', state.r);
  [photoImg, silImg].forEach(el => { el.setAttribute('x', state.cx - state.r); el.setAttribute('y', cy - state.r); el.setAttribute('width', state.r*2); el.setAttribute('height', state.r*2); });
  silImg.setAttribute('href', silUrls[silSel]);
  document.getElementById('photoLayer').style.display = state.mode==='photo' ? '' : 'none';
  document.getElementById('silLayer').style.display = state.mode==='photo' ? 'none' : '';
  cropRect.setAttribute('x', state.cropL);
  cropRect.setAttribute('y', state.cropT);
  cropRect.setAttribute('width', Math.max(1, 141 - state.cropL - state.cropR));
  cropRect.setAttribute('height', Math.max(1, 179 - state.cropT - state.cropB));
  rOut.textContent = state.r; oOut.textContent = state.overlap; cxOut.textContent = state.cx; hrOut.textContent = state.headroom;
  ctOut.textContent = state.cropT; cbOut.textContent = state.cropB; clOut.textContent = state.cropL; crOut.textContent = state.cropR;
  exportBox.value = getExport();
}
function getExport(){
  const lines = [];
  lines.push('const HEAD_RADIUS = ' + state.r + ';');
  lines.push('const HEAD_OVERLAP = ' + state.overlap + ';');
  lines.push('const HEAD_CX = ' + state.cx + ';');
  lines.push('const HEAD_CY = 8 - HEAD_RADIUS + HEAD_OVERLAP;');
  lines.push('const HEAD_TOP = HEAD_CY - HEAD_RADIUS;');
  lines.push('const PHOTO_HEADROOM = Math.ceil(-HEAD_TOP) + ' + state.headroom + ';');
  lines.push('const JERSEY_CROP = { top: ' + state.cropT + ', bottom: ' + state.cropB + ', left: ' + state.cropL + ', right: ' + state.cropR + ' };');
  return lines.join('\n');
}
[[rSlider,'r'],[oSlider,'overlap'],[cxSlider,'cx'],[hrSlider,'headroom'],[ctSlider,'cropT'],[cbSlider,'cropB'],[clSlider,'cropL'],[crSlider,'cropR']].forEach(([el,key])=>{
  el.addEventListener('input', ()=>{ state[key] = parseFloat(el.value); render(); });
});
function setMode(i){
  document.querySelectorAll('.modes button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.modes button')[i].classList.add('active');
  state.mode = i===0 ? 'photo' : 'sil';
  if(i>0) silSel = i-1;
  render();
}
document.getElementById('photoUrl').addEventListener('input', (e)=>{ if(e.target.value) photoImg.setAttribute('href', e.target.value); });
function saveToFile(){
  const blob = new Blob([getExport()], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'photo_head_config.txt';
  a.click();
  document.getElementById('status').textContent = 'Saved photo_head_config.txt — move it to your Super Selector folder, then tell Claude!';
}
render();
</script>
