<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Jersey Outline Editor</title>
<style>
  body { font-family: Arial, sans-serif; background: #F5F0E0; margin: 0; padding: 16px; }
  h3 { text-align: center; margin: 0 0 10px; color: #333; }
  .toolbar { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:10px; }
  button { padding:6px 14px; border-radius:6px; border:1px solid #aaa; cursor:pointer; font-size:12px; background:#fff; }
  button.active { background:#1e3a8a; color:#fff; border-color:#1e3a8a; }
  button:hover { background:#e8e0cc; }
  button.danger { border-color:#c00; color:#c00; }
  button.danger:hover { background:#fdd; }
  button.save { background:#e8f5e9; border-color:#4caf50; color:#2e7d32; font-weight:bold; }
  button.save:hover { background:#c8e6c9; }
  .canvas-wrap { position:relative; display:inline-block; border:2px solid #ccc; border-radius:8px; overflow:hidden; background:white; }
  canvas { display:block; cursor:crosshair; }
  #status { text-align:center; font-size:11px; color:#666; margin-top:8px; min-height:16px; }
  .row { display:flex; gap:24px; justify-content:center; align-items:flex-start; }
  .col { text-align:center; }
  .col p { font-size:11px; color:#888; font-weight:bold; text-transform:uppercase; letter-spacing:1px; margin:0 0 6px; }
</style>
</head>
<body>
<h3>Jersey Outline Editor</h3>
<div class="toolbar">
  <button id="btnAdd" class="active" onclick="setMode('add')">✏️ Add Point</button>
  <button id="btnMove" onclick="setMode('move')">✋ Move Point</button>
  <button id="btnDel" onclick="setMode('delete')">🗑️ Delete Point</button>
  <button onclick="undoLast()">↩ Undo</button>
  <button onclick="clearAll()" class="danger">✕ Clear All</button>
  <button onclick="saveToFile()" class="save">💾 Save Path (for Claude)</button>
</div>

<div class="row">
  <div class="col">
    <p>Reference (trace over me)</p>
    <div class="canvas-wrap">
      <canvas id="cnv" width="282" height="358"></canvas>
    </div>
  </div>
  <div class="col">
    <p>Live SVG Preview</p>
    <div class="canvas-wrap" style="width:282px;height:358px;display:flex;align-items:center;justify-content:center;">
      <svg id="preview" width="282" height="358" viewBox="0 0 141 179" xmlns="http://www.w3.org/2000/svg">
        <rect width="141" height="179" fill="white"/>
        <path id="prevPath" fill="#fff9c4" stroke="#e53935" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
</div>

<div id="status">Mode: Add Point — click on the reference image to place outline points</div>

let pts = [
  [96,16],[164,16],[180,36],[230,64],[252,130],
  [252,138],[212,152],[210,330],[130,342],[50,332],
  [48,152],[28,138],[6,130],[28,64],[84,32]
];
let history = [JSON.parse(JSON.stringify(pts))];
let mode = 'add';
let dragIdx = -1;
const RADIUS = 7;
const cnv = document.getElementById('cnv');
const ctx = cnv.getContext('2d');
const img = new Image();
img.onload = () => { draw(); updatePreview(); };
img.src = 'data:image/png;base64,' + IMG_B64;

function setMode(m) {
  mode = m;
  document.getElementById('btnAdd').classList.toggle('active', m==='add');
  document.getElementById('btnMove').classList.toggle('active', m==='move');
  document.getElementById('btnDel').classList.toggle('active', m==='delete');
  cnv.style.cursor = m==='add' ? 'crosshair' : m==='delete' ? 'not-allowed' : 'grab';
  document.getElementById('status').textContent = m==='add' ? 'Click to add a point — inserts between nearest two'
    : m==='move' ? 'Drag any point to reposition it'
    : 'Click a point to delete it';
}

function nearestPt(x, y) {
  let best=-1, bd=Infinity;
  pts.forEach((p,i)=>{ const d=Math.hypot(p[0]-x,p[1]-y); if(d<bd){bd=d;best=i;} });
  return bd < RADIUS*2 ? best : -1;
}

function insertPt(x, y) {
  if (pts.length < 2) { pts.push([x,y]); return; }
  let best=0, bd=Infinity;
  for (let i=0; i<pts.length; i++) {
    const a=pts[i], b=pts[(i+1)%pts.length];
    const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
    const d=Math.hypot(mx-x, my-y);
    if (d<bd){bd=d;best=i;}
  }
  pts.splice(best+1, 0, [x,y]);
}

cnv.addEventListener('mousedown', e => {
  const {x,y}=pos(e);
  if (mode==='add') { saveHistory(); insertPt(x,y); draw(); updatePreview(); }
  else if (mode==='delete') { const idx=nearestPt(x,y); if(idx>=0){saveHistory();pts.splice(idx,1);draw();updatePreview();} }
  else if (mode==='move') { dragIdx=nearestPt(x,y); if(dragIdx>=0) cnv.style.cursor='grabbing'; }
});
cnv.addEventListener('mousemove', e => {
  if (mode==='move' && dragIdx>=0) { const {x,y}=pos(e); pts[dragIdx]=[x,y]; draw(); updatePreview(); }
});
cnv.addEventListener('mouseup', () => { if(dragIdx>=0){saveHistory();dragIdx=-1;cnv.style.cursor='grab';} });

function pos(e) { const r=cnv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
function saveHistory() { history.push(JSON.parse(JSON.stringify(pts))); if(history.length>50)history.shift(); }
function undoLast() { if(history.length>1){history.pop();pts=JSON.parse(JSON.stringify(history[history.length-1]));draw();updatePreview();} }
function clearAll() { saveHistory(); pts=[]; draw(); updatePreview(); }

function draw() {
  ctx.clearRect(0,0,cnv.width,cnv.height);
  ctx.drawImage(img,0,0,cnv.width,cnv.height);
  if (pts.length<2) return;
  ctx.beginPath();
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();
  ctx.fillStyle='rgba(255,100,100,0.15)'; ctx.fill();
  ctx.strokeStyle='#e53935'; ctx.lineWidth=2; ctx.stroke();
  pts.forEach((p,i)=>{
    ctx.beginPath(); ctx.arc(p[0],p[1],RADIUS,0,Math.PI*2);
    ctx.fillStyle=i===0?'#2196f3':'#e53935'; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 9px Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(i+1,p[0],p[1]);
  });
}

function updatePreview() {
  if (pts.length<2) return;
  const sx=141/282, sy=179/358;
  let d='M '+pts.map(p=>(p[0]*sx).toFixed(1)+','+(p[1]*sy).toFixed(1)).join(' L ')+' Z';
  document.getElementById('prevPath').setAttribute('d',d);
}

function getPath() {
  const sx=141/282, sy=179/358;
  return 'M '+pts.map(p=>(p[0]*sx).toFixed(1)+','+(p[1]*sy).toFixed(1)).join(' L ')+' Z';
}

function saveToFile() {
  const path = getPath();
  const blob = new Blob([path], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'jersey_path.txt';
  a.click();
  document.getElementById('status').textContent = '✅ Saved jersey_path.txt — move it to your Super Selector folder, then tell Claude!';
}

setMode('add');
</script>
