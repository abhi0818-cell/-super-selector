<title>Super Selector – Jersey Preview v3</title>
<style>
  body { background: #0f1117; font-family: 'Segoe UI', sans-serif; color: #eee; padding: 20px; }
  h2 { text-align: center; margin-bottom: 6px; font-size: 20px; color: #f0c040; }
  .subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 24px; }
  .team-section { margin-bottom: 32px; }
  .team-label { font-size: 13px; font-weight: bold; color: #aaa; margin-bottom: 10px; letter-spacing: 1px; }
  .pool-grid { display: grid; grid-template-columns: repeat(4, 100px); gap: 14px; }
  .player-card {
    background: #1a1e2a; border-radius: 10px; padding: 10px 6px 7px;
    text-align: center; position: relative; border: 1px solid #2a2e3a;
    cursor: pointer; transition: border-color 0.2s, transform 0.15s;
  }
  .player-card:hover { border-color: #C9A84C; transform: translateY(-2px); }
  .player-card.selected { border-color: #3ddc84; background: #1a2e1e; }
  .role-icon { position: absolute; top: 5px; left: 5px; width: 26px; height: 26px; object-fit: contain; z-index: 2; }
  .jersey-wrap { width: 74px; height: 80px; margin: 0 auto 5px; }
  .pname { font-size: 10px; font-weight: 600; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pmeta { font-size: 9px; color: #888; margin-top: 1px; }
  .role-badge { display: inline-block; font-size: 8px; font-weight: bold; padding: 1px 4px; border-radius: 3px; margin-top: 2px; }
  .role-WK   { background: #7c3aed; color: #fff; }
  .role-BAT  { background: #2563eb; color: #fff; }
  .role-AR   { background: #d97706; color: #fff; }
  .role-BOWL { background: #6d28d9; color: #fff; }
  .pts { font-size: 9px; color: #C9A84C; margin-top: 2px; }
  .counter { text-align:center; font-size:13px; color:#3ddc84; margin-bottom:16px; font-weight:600; }
</style>
</head>

// Fallback: derive accent from shirt luminance
function deriveAccent(hex) {
  const c = hex.replace('#','');
  const r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
  const lum = (r*299+g*587+b*114)/1000;
  return lum > 128 ? '#1e293b' : '#c8a830';
}
function getColors(team) {
  if (TEAM_COLORS[team]) return [TEAM_COLORS[team].shirt, TEAM_COLORS[team].accent];
  return ['#555', deriveAccent('#555')];
}

function isLight(hex) {
  const c = hex.replace('#','');
  const r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
  return (r*299+g*587+b*114)/1000 > 145;
}
function initials(name) {
  return name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

function jersey(inits, shirt, accent, W, H) {
  W = W||74; H = H||80;
  const cx = W*0.50;
  const sk = '#111';  // stroke/outline color
  const sw = 2.2;
  const textCol = isLight(shirt) ? '#111' : '#fff';

  // Coordinates derived by pixel-tracing the 714×750 reference image
  const nkLx=W*0.37, nkRx=W*0.63, nkY=H*0.115, nkDipY=H*0.065;
  const shLx=W*0.215, shRx=W*0.785, shY=H*0.115;
  const slLx=W*0.015, slRx=W*0.985, slY=H*0.40;
  const ahCLx=W*0.09, ahCRx=W*0.91, ahCY=H*0.525;
  const bLx=W*0.23, bRx=W*0.77, bTopY=H*0.535;
  const hLx=W*0.215, hRx=W*0.785, hY=H*0.965;

  // Jersey silhouette
  const outline = `M ${nkLx} ${nkY} Q ${cx} ${nkDipY} ${nkRx} ${nkY}
    L ${shRx} ${shY} L ${slRx} ${slY}
    Q ${ahCRx} ${ahCY} ${bRx} ${bTopY}
    L ${hRx} ${hY} Q ${cx} ${H*1.005} ${hLx} ${hY}
    L ${bLx} ${bTopY} Q ${ahCLx} ${ahCY} ${slLx} ${slY}
    L ${shLx} ${shY} Z`;

  // Shoulder yoke (accent) — diagonal panels
  const yokeL = `M ${nkLx} ${nkY} L ${shLx} ${shY} L ${slLx} ${slY}
    Q ${ahCLx} ${ahCY} ${bLx} ${bTopY}
    Q ${W*0.32} ${H*0.38} ${cx} ${H*0.44}
    Q ${W*0.39} ${H*0.20} ${nkLx} ${nkY} Z`;
  const yokeR = `M ${nkRx} ${nkY} L ${shRx} ${shY} L ${slRx} ${slY}
    Q ${ahCRx} ${ahCY} ${bRx} ${bTopY}
    Q ${W*0.68} ${H*0.38} ${cx} ${H*0.44}
    Q ${W*0.61} ${H*0.20} ${nkRx} ${nkY} Z`;

  // Sleeve cuff (accent, lower portion of sleeve)
  const cuffH = H*0.052;
  const cuffL = `M ${slLx} ${slY-cuffH} L ${W*0.19} ${slY-cuffH}
    Q ${ahCLx} ${ahCY} ${bLx} ${bTopY}
    Q ${ahCLx-W*0.02} ${ahCY-H*0.02} ${slLx+W*0.10} ${slY-cuffH*0.5}
    L ${slLx} ${slY-cuffH} Z`;
  const cuffR = `M ${slRx} ${slY-cuffH} L ${W*0.81} ${slY-cuffH}
    Q ${ahCRx} ${ahCY} ${bRx} ${bTopY}
    Q ${ahCRx+W*0.02} ${ahCY-H*0.02} ${slRx-W*0.10} ${slY-cuffH*0.5}
    L ${slRx} ${slY-cuffH} Z`;

  // Side panels (accent curves on body sides)
  const pw = W*0.10;
  const panelL = `M ${bLx} ${bTopY}
    Q ${bLx-pw*0.4} ${H*0.68} ${hLx+pw*0.2} ${hY}
    L ${hLx+pw*1.1} ${hY}
    Q ${bLx+pw*0.7} ${H*0.68} ${bLx+pw} ${bTopY} Z`;
  const panelR = `M ${bRx} ${bTopY}
    Q ${bRx+pw*0.4} ${H*0.68} ${hRx-pw*0.2} ${hY}
    L ${hRx-pw*1.1} ${hY}
    Q ${bRx-pw*0.7} ${H*0.68} ${bRx-pw} ${bTopY} Z`;

  // Polo collar
  const colDark = '#1c1c2e';
  const colWLx=W*0.19, colWRx=W*0.81, colWY=H*0.225;
  const collarOuter = `M ${nkLx-W*0.02} ${nkY}
    Q ${cx} ${nkDipY-H*0.03} ${nkRx+W*0.02} ${nkY}
    L ${colWRx} ${colWY} Q ${cx} ${H*0.235} ${colWLx} ${colWY} Z`;
  const collarFold = `M ${nkLx} ${nkY}
    Q ${cx} ${nkDipY+H*0.01} ${nkRx} ${nkY}
    L ${colWRx-W*0.04} ${colWY-H*0.03}
    Q ${cx} ${H*0.195} ${colWLx+W*0.04} ${colWY-H*0.03} Z`;

  // Placket + buttons
  const pkX=cx-W*0.04, pkW=W*0.08, pkTop=H*0.145, pkBot=H*0.40;
  const btn1Y = pkTop+(pkBot-pkTop)*0.30;
  const btn2Y = pkTop+(pkBot-pkTop)*0.62;
  const btnR  = W*0.028;

  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
  <path d="${outline}" fill="${shirt}" stroke="${sk}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="${yokeL}"  fill="${accent}" opacity="0.85" stroke="none"/>
  <path d="${yokeR}"  fill="${accent}" opacity="0.85" stroke="none"/>
  <path d="${cuffL}"  fill="${accent}" opacity="0.90" stroke="none"/>
  <path d="${cuffR}"  fill="${accent}" opacity="0.90" stroke="none"/>
  <path d="${panelL}" fill="${accent}" opacity="0.40" stroke="none"/>
  <path d="${panelR}" fill="${accent}" opacity="0.40" stroke="none"/>
  <path d="${outline}" fill="none" stroke="${sk}" stroke-width="${sw}" stroke-linejoin="round"/>
  <path d="${collarOuter}" fill="${accent}" stroke="${sk}" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="${collarFold}"  fill="${colDark}" stroke="${sk}" stroke-width="0.9" stroke-linejoin="round"/>
  <rect x="${pkX}" y="${pkTop}" width="${pkW}" height="${pkBot-pkTop}" rx="2" fill="${colDark}" opacity="0.75"/>
  <circle cx="${cx}" cy="${btn1Y}" r="${btnR}" fill="#e8e8e8" stroke="#333" stroke-width="0.8"/>
  <circle cx="${cx}" cy="${btn2Y}" r="${btnR}" fill="#e8e8e8" stroke="#333" stroke-width="0.8"/>
  <text x="${cx}" y="${H*0.73}" text-anchor="middle" dominant-baseline="middle"
    font-family="'Segoe UI',Arial,sans-serif" font-size="${W*0.195}" font-weight="800"
    fill="${textCol}" opacity="0.88">${inits}</text>
</svg>`;
}

const selected = new Set();
function toggleSelect(idx) {
  if (selected.has(idx)) selected.delete(idx);
  else if (selected.size < 11) selected.add(idx);
  render();
}

function render() {
  const teams = {};
  PLAYERS.forEach((p,i) => {
    if (!teams[p.team]) teams[p.team] = [];
    teams[p.team].push({...p, idx:i});
  });
  let html = '';
  for (const [team, players] of Object.entries(teams)) {
    const [shirt, accent] = getColors(team);
    html += '<div class="team-section"><div class="team-label">'+team+'</div><div class="pool-grid">';
    players.forEach(p => {
      const sel = selected.has(p.idx);
      const jsvg = jersey(initials(p.name), shirt, accent, 74, 80);
      const icon = roleIcon(p.role);
      html += '<div class="player-card'+(sel?' selected':'')+'" onclick="toggleSelect('+p.idx+')">'
        + '<img class="role-icon" src="'+icon+'" alt="'+p.role+'"/>'
        + '<div class="jersey-wrap">'+jsvg+'</div>'
        + '<div class="pname" title="'+p.name+'">'+p.name+'</div>'
        + '<div class="pmeta"><span class="role-badge role-'+p.role+'">'+p.role+'</span></div>'
        + '<div class="pts">&#9733; '+p.pts+' &nbsp;&#8377;'+p.cap+'Cr</div>'
        + '</div>';
    });
    html += '</div></div>';
  }
  document.getElementById('app').innerHTML = html;
  document.getElementById('counter').textContent = selected.size + ' / 11 selected';
}
render();
</script>
</body>
</html>
